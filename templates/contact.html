<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | ExitZero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #334155; }</style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="w-full bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3">
                <img src="/static/logo.png" alt="ExitZero" class="w-10 h-10 object-cover rounded-lg shadow-sm">
                <span class="text-xl font-bold tracking-tight text-slate-900">ExitZero</span>
            </a>
            <a href="/" class="text-sm font-bold text-slate-500 hover:text-slate-900">Back to Home</a>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="max-w-2xl w-full bg-white border border-slate-200 rounded-2xl shadow-xl p-8 md:p-12 text-center">
            
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>

            <h1 class="text-3xl font-bold text-slate-900 mb-4">Get in touch</h1>
            <p class="text-lg text-slate-500 mb-8">
                Have a question about your starter kit? <br>
                We typically reply within 24 hours.
            </p>

            <div class="bg-slate-50 border border-slate-100 rounded-xl p-6 mb-8">
                <p class="text-sm font-bold text-slate-400 uppercase tracking-wide mb-1">Support Email</p>
                <a href="mailto:support@exitzero.in" class="text-2xl font-bold text-slate-900 hover:text-emerald-600 transition">
                    support@exitzero.in
                </a>
            </div>

            <div class="text-sm text-slate-400">Operating from India 🇮🇳</div>
        </div>
    </main>

    <footer class="py-8 text-center text-slate-400 text-sm border-t border-slate-200 bg-white">
        &copy; 2025 ExitZero Inc. All rights reserved.
    </footer>
</body>
</html>
