<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful | ExitZero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }</style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-900">

    <div class="text-center max-w-lg p-8">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <h1 class="text-3xl font-bold mb-2">Payment Successful!</h1>
        <p class="text-slate-500 mb-8">Thank you for investing in your career. Your kit is ready.</p>

        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xl mb-8">
            <h2 id="projectTitle" class="font-bold text-lg mb-1">Loading Project...</h2>
            <p class="text-sm text-slate-400 mb-6">Includes: Source Code, Interview Prep, LinkedIn Post</p>
            
            <button onclick="downloadNow()" id="dlBtn" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-xl transition flex justify-center items-center gap-2">
                Download .zip
            </button>
        </div>

        <a href="/" class="text-sm font-bold text-slate-400 hover:text-slate-900">Start New Project</a>
    </div>

    <script>
        // Retrieve the pending project from LocalStorage
        const project = JSON.parse(localStorage.getItem('pendingProject'));

        if (project) {
            document.getElementById('projectTitle').innerText = project.title;
        } else {
            document.getElementById('projectTitle').innerText = "No pending project found.";
            document.getElementById('dlBtn').disabled = true;
            document.getElementById('dlBtn').classList.add('opacity-50');
        }

        async function downloadNow() {
            const btn = document.getElementById('dlBtn');
            btn.innerText = "Building Zip...";
            
            try {
                const response = await fetch('/download-kit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: project.title, tech_stack: project.tech_stack })
                });
                
                if (!response.ok) throw new Error("Download failed");
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${project.title.replace(/\s+/g, '_').toLowerCase()}_kit.zip`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                btn.innerText = "Download Again";
                
                // Clear the pending project so they don't download old stuff later
                localStorage.removeItem('pendingProject');

            } catch (e) {
                alert("Error: " + e.message);
                btn.innerText = "Try Again";
            }
        }
    </script>
</body>
</html>
